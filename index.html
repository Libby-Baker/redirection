<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube is Closed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fafafa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .card {
      background-color: #fff0f6;
      border: 2px solid #d946ef;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 12px rgba(217, 70, 239, 0.08);
    }

    h1 {
      color: #d946ef;
      font-size: 1.75rem;
      margin-bottom: 1.25rem;
      line-height: 1.3;
    }

    p {
      color: #2d3748;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    p:last-child {
      color: #d946ef;
      font-weight: 600;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Youtube is closed until after Chanukah</h1>
    <p>Come back after Sunday, December 13th.</p>
    <p>Please go do something productive with your extra time.</p>
    <p>You're doing great! Keep climbing 🩷</p>
  </div>

</body>
</html>
